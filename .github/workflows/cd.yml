name: CD

# Manual deploys of an image that ALREADY EXISTS. Never triggered by a push, a tag or a release.
#
#   target=gameservers  image=ghcr.io/nghaiz/ironfront-game-server:<tag_or_digest> (EC2, over SSM)
#   target=master       image=ghcr.io/nghaiz/ironfront-master@sha256:<digest>      (EC2, over SSM)
#
# Both paths deploy over AWS Systems Manager (SSM) Run Command to EC2 instances in ap-southeast-2
# (Sydney). No SSH ports open, no private SSH keys needed:
#   - gameservers: infra/terraform/aws/game/deploy.sh
#   - master: infra/terraform/aws/master/deploy.sh
#
# Credentials:
#   variable MASTER_INSTANCE_ID and GAMESERVER_INSTANCE_ID plus AWS credentials in environment secrets
#   (AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY for IAM user ironfront-github-deploy, or OIDC role
#   AWS_DEPLOY_ROLE_ARN). The IAM identity may only run SSM commands on those two instances.
#
# Runs only from main: the deploy.sh scripts come from the ref, so a branch could otherwise
# deploy unreviewed code. The "production" environment allows only main and requires the owner's
# approval for every run.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        type: choice
        options:
          - gameservers
          - master
      image:
        description: 'gameservers: ghcr.io/nghaiz/ironfront-game-server:<tag_or_digest> or ironfront-game-server:<rev>. master: ghcr.io/nghaiz/ironfront-master@sha256:<digest>'
        required: true
        type: string
      force:
        description: 'Deploy even while a room is live (its players are dropped)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write   # GitHub OIDC -> the AWS role
      packages: write   # the "live" tag on the deployed image
    env:
      TARGET: ${{ inputs.target }}
      IMAGE: ${{ inputs.image }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Validate the inputs
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::CD runs only from main, not $GITHUB_REF"; exit 1; }
          case "$TARGET" in
            gameservers) re='^((ghcr\.io/[a-zA-Z0-9_.-]+/)?ironfront-game-server(:[0-9a-fA-Za-z_.-]+|@sha256:[0-9a-f]{64}))$' ;;
            master)      re='^ghcr\.io/nghaiz/ironfront-master@sha256:[0-9a-f]{64}$' ;;
            *) echo "::error::unknown target '$TARGET'"; exit 1 ;;
          esac
          [[ "$IMAGE" =~ $re ]] || { echo "::error::image for $TARGET must match $re"; exit 1; }
          [[ "$FORCE" == true || "$FORCE" == false ]] || { echo "::error::force must be true or false"; exit 1; }
          echo "deploying $IMAGE to $TARGET (force=$FORCE)"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ---- AWS credentials (SSM for both master and gameservers) --------------------------------
      - name: Check the AWS credentials exist
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          MASTER_INSTANCE: ${{ vars.MASTER_INSTANCE_ID }}
          GAME_INSTANCE: ${{ vars.GAMESERVER_INSTANCE_ID }}
          KEYS_SET: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$TARGET" = "master" ] && [ -z "$MASTER_INSTANCE" ]; then
            echo "::error::variable MASTER_INSTANCE_ID is not set; nothing was deployed"; exit 1
          fi
          if [ "$TARGET" = "gameservers" ] && [ -z "$GAME_INSTANCE" ]; then
            echo "::error::variable GAMESERVER_INSTANCE_ID is not set; nothing was deployed"; exit 1
          fi
          if [ -z "$ROLE" ] && [ "$KEYS_SET" != true ]; then
            echo "::error::neither AWS_DEPLOY_ROLE_ARN nor the AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets are set; nothing was deployed"; exit 1
          fi

      - name: AWS credentials (OIDC role)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: AWS credentials (IAM user key)
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Check the AWS identity before deploying
        run: |
          set -euo pipefail
          arn=$(aws sts get-caller-identity --query Arn --output text)
          echo "deploying as $arn"
          case "$arn" in
            *:user/ironfront-github-deploy|*:assumed-role/ironfront-github-deploy/*) ;;
            *) echo "::error::unexpected AWS identity $arn; nothing was deployed"; exit 1 ;;
          esac

      # ---- gameservers (EC2 over SSM) ----------------------------------------------------------
      - name: Deploy the game servers
        if: inputs.target == 'gameservers'
        env:
          IMAGE: ${{ inputs.image }}
          INSTANCE_ID: ${{ vars.GAMESERVER_INSTANCE_ID }}
          REGION: ap-southeast-2
        run: |
          set -euo pipefail
          if [ "$FORCE" = true ]; then export FORCE=1; else export FORCE=0; fi
          infra/terraform/aws/game/deploy.sh "$IMAGE"

      # ---- master (EC2 over SSM) ---------------------------------------------------------------
      - name: Deploy the master
        if: inputs.target == 'master'
        env:
          IRONFRONT_MASTER_IMAGE: ${{ inputs.image }}
          INSTANCE_ID: ${{ vars.MASTER_INSTANCE_ID }}
          REGION: ap-southeast-2
          BUCKET: unused-by-deploy
        run: |
          set -euo pipefail
          if [ "$FORCE" = true ]; then export FORCE=1; else export FORCE=0; fi
          GH_TOKEN='' infra/terraform/aws/master/deploy.sh

      # ---- Tag deployed image as live on GHCR (if from GHCR) -----------------------------------
      - uses: docker/login-action@v4
        if: startsWith(inputs.image, 'ghcr.io/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the deployed image "live" on GHCR
        if: startsWith(inputs.image, 'ghcr.io/')
        run: |
          set -euo pipefail
          if [[ "$IMAGE" =~ @sha256: ]]; then
            live="${IMAGE%@*}:live"
          else
            live="${IMAGE%:*}:live"
          fi
          docker buildx imagetools create --tag "$live" "$IMAGE" || true
          echo "$live -> $IMAGE"
