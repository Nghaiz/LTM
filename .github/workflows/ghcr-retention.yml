name: ghcr-retention

# Deletes old ironfront image versions from GHCR (tools/prune_ghcr.py).
#
# images.yml adds a master image on every push to develop and main and nothing removed
# them: 693 versions had piled up by 2026-09-29. This keeps every name-tagged image
# (branch, semver, release), timestamp-only images from the last 30 days plus the 10
# newest, and the image the Fly master machine runs. FLY_API_TOKEN is required: without
# it the live master image would be protected only by its age, so the job refuses.
#
# Manual dispatch defaults to a dry run; the schedule applies.

on:
  schedule:
    - cron: '0 20 * * 0'   # Monday 03:00 Vietnam time
  workflow_dispatch:
    inputs:
      apply:
        description: Delete (unchecked prints the plan only).
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args="--require-fly"
          if [ "$APPLY" = "true" ]; then args="$args --apply"; fi
          python3 tools/prune_ghcr.py $args
