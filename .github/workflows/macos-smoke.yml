name: macOS smoke

# Opens a packaged macOS release zip on real Macs. The machine that builds the macOS player is
# Windows: it can write Ironfront.app but never start it, so everything a Mac decides at launch is
# checked here instead -- the executable bit the zip has to carry, both architectures in the
# universal binary, the ad-hoc signature Apple silicon refuses to run without, the player reaching
# its menu and master endpoint, and then a practice match: a map loaded and played against bots
# with the loopback server on the same Mac.
#
# How to run it on a zip that is not public yet (docs/releasing.md § 7):
#   gh release create macos-smoke-<n> --draft --title "macOS smoke <n>" artifacts/release/<zip>
#   git tag macos-smoke-<n> <commit> && git push origin macos-smoke-<n>     # starts this run
# or, for any release that holds a *-macos.zip (drafts included):
#   gh workflow run macos-smoke.yml -f release=v4.5.0
#
# It reads the release through the API rather than its download URL because a draft has no
# public URL, and that is also why the token needs contents: write.

on:
  push:
    tags: ['macos-smoke-*']
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag holding the *-macos.zip (a draft release works)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  smoke:
    name: macOS ${{ matrix.arch }}
    # Apple silicon. The x86_64 half of the universal binary runs there under Rosetta, which is
    # also how an Intel-only build would reach most players' Macs.
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Download the macOS zip
        run: |
          set -euo pipefail
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$RELEASE\")][0].assets[] | select(.name | endswith(\"-macos.zip\")) | .url")
          if [ -z "$url" ]; then echo "::error::release $RELEASE has no *-macos.zip"; exit 1; fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o ironfront.zip "$url"
          ls -l ironfront.zip

      - name: Unzip it the way Finder does
        run: |
          set -euo pipefail
          ditto -x -k ironfront.zip extracted
          app=$(find "$PWD/extracted" -maxdepth 2 -name Ironfront.app -type d | head -1)
          if [ -z "$app" ]; then echo "::error::no Ironfront.app in the zip"; exit 1; fi
          plist="$app/Contents/Info.plist"
          echo "APP=$app" >> "$GITHUB_ENV"
          # Unity names the executable after productName, not after the .app; macOS reads it here.
          echo "EXE=$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" >> "$GITHUB_ENV"
          ls -la "$(dirname "$app")"

      - name: Bundle checks
        run: |
          set -euo pipefail
          ls -l "$EXE"
          if [ ! -x "$EXE" ]; then echo "::error::$EXE is not executable after unzipping"; exit 1; fi
          archs=$(lipo -archs "$EXE")
          echo "architectures: $archs"
          case " $archs " in *" x86_64 "*) ;; *) echo "::error::no x86_64 slice"; exit 1;; esac
          case " $archs " in *" arm64 "*) ;; *) echo "::error::no arm64 slice"; exit 1;; esac
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -12
          # Expected to be rejected: the app is signed ad hoc, not notarized. Players clear this
          # once in System Settings > Privacy & Security; the README says how.
          spctl --assess --type execute -vv "$APP" || echo "Gatekeeper: not notarized (expected)"

      - name: Rosetta
        if: matrix.arch == 'x86_64'
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      # A real mouse click. System Events' "click at" goes through the accessibility tree, and a
      # Unity window has no element there to click (run 4: DEPLOY never pressed). Compiled before
      # the player starts so the compile time stays out of its timeline.
      - name: Mouse helper
        run: |
          cat > click.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let point = CGPoint(x: Double(CommandLine.arguments[1])!, y: Double(CommandLine.arguments[2])!)
          for type in [CGEventType.mouseMoved, .leftMouseDown, .leftMouseUp] {
              CGEvent(mouseEventSource: nil, mouseType: type, mouseCursorPosition: point, mouseButton: .left)?
                  .post(tap: .cghidEventTap)
              usleep(150_000)
          }
          SWIFT
          swiftc -O click.swift -o click

      - name: Menu, then a practice match
        run: |
          set -uo pipefail
          log="$PWD/player-$ARCH.log"
          alive() { kill -0 "$pid" 2>/dev/null; }
          wait_while_alive() { for _ in $(seq 1 "$1"); do sleep 1; alive || return 0; done; }
          click_at() {  # screen points; the runner's display is 1024x768 at 1x, the size of a screenshot
            osascript -e "tell application id \"$BUNDLE_ID\" to activate" >/dev/null 2>&1
            ./click "$1" "$2" 2>>keys.err
          }
          keys() {  # key codes: 48 Tab, 36 Return
            osascript -e "tell application id \"$BUNDLE_ID\" to activate" >/dev/null 2>&1
            local code
            for code in "$@"; do
              osascript -e "tell application \"System Events\" to key code $code" 2>>keys.err || return 1
              sleep 2
            done
          }

          arch "-$ARCH" "$EXE" -logFile "$log" \
            -screen-fullscreen 0 -screen-width 1280 -screen-height 720 &
          pid=$!

          # The macOS player buffers its log and writes it out when it quits cleanly: run 1 of this
          # workflow killed a player sitting at the menu and found 40 lines of engine start-up and
          # nothing after. So it is never polled; the player is driven on timers, asked to quit,
          # and the log is read once it has.
          wait_while_alive 60
          screencapture -x "shot-$ARCH-menu.png" || true
          if ! alive; then
            wait "$pid"; echo "::error::the player exited on its own (status $?) at the menu"; tail -60 "$log"; exit 1
          fi

          # Into practice from the keyboard (MenuKeyboardNavigator): MULTIPLAYER has focus, Tab
          # moves to PRACTICE OFFLINE, Return opens it, and Return on the map dropdown falls through
          # to the panel's primary button, START PRACTICE.
          practice=yes
          if ! keys 48 36 36; then
            practice=no
            echo "::warning::System Events would not send keys on this runner ($(tail -1 keys.err)); practice match not played"
          fi
          if [ "$practice" = yes ]; then
            wait_while_alive 90
            screencapture -x "shot-$ARCH-practice.png" || true
            # The map opens on the loadout screen. DEPLOY sits bottom right at this window size;
            # whether the click reached the game is judged from the next screenshot, not here.
            click_at 800 644 || echo "::warning::System Events would not click ($(tail -1 keys.err))"
            wait_while_alive 45
            screencapture -x "shot-$ARCH-deployed.png" || true
            if ! alive; then
              wait "$pid"; echo "::error::the player exited on its own (status $?) during the practice match"; tail -80 "$log"; exit 1
            fi
          fi

          # Quit the way the Dock does, with an Apple Event Unity answers by shutting down. Cmd+Q
          # through System Events is the fallback; SIGINT the last resort before giving up.
          quit_via=none
          started=$(date +%s)
          for how in apple-event cmd-q sigint; do
            case "$how" in
              apple-event) osascript -e "with timeout of 10 seconds" -e "tell application id \"$BUNDLE_ID\" to quit" \
                                     -e "end timeout" >/dev/null 2>&1 & ;;
              cmd-q) osascript -e "tell application id \"$BUNDLE_ID\" to activate" \
                               -e "tell application \"System Events\" to keystroke \"q\" using command down" >/dev/null 2>&1 & ;;
              sigint) kill -INT "$pid" 2>/dev/null ;;
            esac
            wait_while_alive 20
            if ! alive; then quit_via=$how; break; fi
          done
          if [ "$quit_via" = none ]; then
            kill -9 "$pid" 2>/dev/null
            echo "::error::the player did not quit when asked (Apple Event, Cmd+Q, SIGINT); its log was never written out"
            tail -60 "$log"; exit 1
          fi
          wait "$pid"; status=$?
          echo "quit via $quit_via in $(( $(date +%s) - started )) s, exit status $status"

          echo "--- player log markers"
          grep -E '\[(flow|net)\]|Exception|Crash' "$log" | head -80 || true
          failed=no
          need() {
            if grep -q "$1" "$log"; then echo "ok   $2"; else echo "::error::missing from the player log: $2"; failed=yes; fi
          }
          need '\[flow\] master = kien-master-2026.fly.dev:443 (TLS' "[flow] master = kien-master-2026.fly.dev:443 (TLS ..."
          need '\[flow\] client flow up; title screen ready' "[flow] client flow up; title screen ready"
          if [ "$practice" = yes ]; then
            # Practice runs offline: no loopback server and no client bootstrap, hence no [net] build
            # line (package-release.ps1 checks the stamp in the DLL instead).
            need '\[net\] this process plays offline' "[net] this process plays offline (practice started)"
            need "\[vegetation\] 'Terrain" "[vegetation] 'Terrain ...' (the map's terrain loaded)"
          fi
          exceptions=$(grep -c 'Exception' "$log" || true)
          echo "exception lines in the log: $exceptions"
          if [ "$exceptions" -gt 0 ]; then echo "::error::the player log holds $exceptions exception line(s)"; failed=yes; fi
          if [ "$status" -ne 0 ]; then echo "::error::the player exited with status $status"; failed=yes; fi
          [ "$failed" = no ]

      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-${{ matrix.arch }}
          path: |
            player-*.log
            shot-*.png
          if-no-files-found: ignore
          retention-days: 14
