    url: https://github.com/Nghaiz/LTM/blob/main/plans/00-shared/protocol-spec.md
    about: The frozen wire format. If your question is "what should the bytes look like", the answer is here.
  - name: Architecture
    url: https://github.com/Nghaiz/LTM/blob/main/docs/architecture.md
    about: How the five projects fit together and why the shared library must never reference UnityEngine.
