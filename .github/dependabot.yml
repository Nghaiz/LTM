version: 2

# OWNER: Dev D (tools/ and CI, plans/00-shared/conventions.md section 7).
#
# Two ecosystems, both weekly, both small on purpose.
#
# github-actions matters more than it looks: ci.yml pins actions/checkout@v4 and
# setup-dotnet@v4, and nobody on a four-month capstone is going to notice a security patch
# to a third-party action on their own. A pinned action that never gets updated is a
# dependency you have stopped maintaining without deciding to.
#
# nuget is intentionally low-volume — Central Package Management means the whole solution
# has four packages, all test tooling. Any Dependabot PR that proposes a netcode framework
# (Mirror, LiteNetLib, ENet, KCP, SignalR, gRPC) is a mistake to close, not to merge:
# conventions.md section 3.4 makes those a hard line.

updates:
  - package-ecosystem: nuget
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      # Matches the conventional-commit scopes in conventions.md section 1.2, so
      # tools/check-commit-scope.ps1 does not flag Dependabot's own PRs.
      prefix: 'chore(tools)'
    labels:
      - dependencies
    groups:
      # One PR for the whole test stack instead of four. Microsoft.NET.Test.Sdk, xunit and
      # the runner have to move together anyway; splitting them produces PRs that each fail
      # until the others land.
      test-stack:
        patterns:
          - 'xunit*'
          - 'Microsoft.NET.Test.Sdk'
          - 'coverlet.*'
    ignore:
      # Microsoft.CodeAnalysis.CSharp is not an ordinary dependency — it is the compiler,
      # and the SDK band in global.json decides which version of it we are allowed to load.
      #
      # The .NET 8 SDK ships csc 4.11. Roslyn 4.12 and later drag in a
      # Microsoft.CodeAnalysis.Analyzers built against a newer compiler, and the build stops
      # with CS9057 ("the analyzer assembly references version 4.12.0.0 of the compiler,
      # which is newer than the currently running version 4.11.0.0"). That is not a
      # transient break to wait out: it holds for every major above our SDK band. PR #93
      # (4.11.0 -> 5.6.0) failed exactly this way on both runners.
      #
      # Suppressing the analyzers with ExcludeAssets would silence the error, but the whole
      # job of tools/UnitySyntaxCheck is to parse at Unity's C# level, which 4.11 already
      # does — a newer Roslyn buys nothing and only widens what can break.
      #
      # So this pin is downstream of the SDK decision, not independent of it. global.json
      # already says a move to .NET 9 changes three files in the SAME PR; make this ignore
      # entry the fourth and let the bot propose the matching Roslyn major again.
      - dependency-name: 'Microsoft.CodeAnalysis.CSharp'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - dependencies
      - ci
