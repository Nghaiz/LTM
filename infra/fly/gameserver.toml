# Ironfront game server — fly.io app config.
#
# Deploy with:
#   fly deploy --config infra/fly/gameserver.toml --app kien-game-server-2026
#
# Secrets (set once, must match master):
#   fly secrets set IRONFRONT_SHARED_SECRET="<key>" --app kien-game-server-2026

app = "kien-game-server-2026"
primary_region = "sin"

[build]
  image = "ghcr.io/nghaiz/ironfront-game-server:2026-08-21t14-25-11vn"

[env]
  IRONFRONT_GAMESERVER_TRANSPORT              = "udp"
  IRONFRONT_GAMESERVER_UDP_PORT               = "27015"
  IRONFRONT_MASTER_HOST                       = "kien-master-2026.fly.dev"
  IRONFRONT_MASTER_PORT                       = "27000"
  IRONFRONT_GAMESERVER_MASTER_TLS             = "1"
  IRONFRONT_GAMESERVER_MASTER_TLS_TARGET_HOST = "kien-master-2026.fly.dev"
  IRONFRONT_GAMESERVER_ACCEPT_UNSIGNED_TICKETS = "0"
  IRONFRONT_GAMESERVER_MAX_PLAYERS            = "16"
  IRONFRONT_GAMESERVER_MAX_CONNECTIONS        = "16"

[[services]]
  protocol      = "udp"
  internal_port = 27015

  [[services.ports]]
    port = 27015