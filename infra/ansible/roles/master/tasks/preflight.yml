---
# Preflight checks for Master Server deployment

- name: Validate that master_image is not using :latest tag
  ansible.builtin.fail:
    msg: "Refusing :latest for master image. Pin an immutable digest (@sha256:...) or specific tag."
  when: "':latest' in master_image"

- name: Check if durability CSV exists on master
  ansible.builtin.stat:
    path: "{{ ironfront_data_dir }}/durability.csv"
  register: durability_csv_stat

- name: Check active rooms from durability CSV
  ansible.builtin.shell: |
    awk -F, '
      NR == 1 { for (i = 1; i <= NF; i++) { if ($i == "roomsActive") r = i; if ($i == "roomsInMatch") m = i } next }
      /^[0-9][0-9][0-9][0-9]-/ { row = $0 }
      END { if (r && row != "") { split(row, v, ","); print v[r], v[m], v[1] } else print "0 0 unknown" }' \
      "{{ ironfront_data_dir }}/durability.csv"
  register: active_rooms_output
  changed_when: false
  when:
    - durability_csv_stat.stat.exists
    - durability_csv_stat.stat.size > 0

- name: Parse room metrics
  ansible.builtin.set_fact:
    rooms_active: "{{ active_rooms_output.stdout.split()[0] | int }}"
    rooms_in_match: "{{ active_rooms_output.stdout.split()[1] | int }}"
    sampled_at: "{{ active_rooms_output.stdout.split()[2] }}"
  when: active_rooms_output is defined and active_rooms_output.stdout is defined

- name: Display active rooms status
  ansible.builtin.debug:
    msg: "Master status at {{ sampled_at | default('unknown') }}: {{ rooms_active | default(0) }} room(s) open, {{ rooms_in_match | default(0) }} in match."

- name: Abort deployment if active rooms exist and force_deploy is false
  ansible.builtin.fail:
    msg: "{{ rooms_active }} room(s) open on master. A restart drops active players. Wait or run with -e force_deploy=true."
  when:
    - rooms_active is defined
    - rooms_active | int > 0
    - not force_deploy | bool

- name: Warn if deploying with active rooms under force_deploy
  ansible.builtin.debug:
    msg: "WARNING: force_deploy is enabled. Deploying with {{ rooms_active }} active room(s)!"
  when:
    - rooms_active is defined
    - rooms_active | int > 0
    - force_deploy | bool
