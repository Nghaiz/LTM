---
# Game-server deploy on the Azure VM. Order, and why:
#   1. Preflight, read-only: the image name, the stack on the VM, the image present, no live room.
#   2. Backup of .env + compose file + every container's log (the match record) — before any change.
#   3. Change: compose file from infra/docker/, image line in .env, `docker compose up -d`.
#   4. Verify: each container runs the new image and logged "master link: registered as server"
#      SINCE ITS CURRENT START (a line from an earlier run cannot pass for one).
#   5. Any failure in 3-4 restores the backup, brings the previous image back, verifies it the same
#      way, and fails the run naming both images.
# Docker runs through `sudo -n` as irondev (as tools/deploy-gameservers-azure.ps1 does), so every
# file this writes stays owned by irondev and the PowerShell tool keeps working afterwards.

# ---- 1. preflight (changes nothing) ----------------------------------------------------------

- name: Refuse an image that is not a game-server build tag
  ansible.builtin.assert:
    that:
      - gameserver_image is string
      - gameserver_image is match('^ironfront-game-server:[0-9a-f]{7,40}$')
    fail_msg: >-
      gameserver_image must be ironfront-game-server:<git rev> (7-40 hex), already loaded on the VM;
      got '{{ gameserver_image }}'.
    quiet: true

- name: Read the compose file this run would install (on the controller)
  ansible.builtin.stat:
    path: "{{ gameserver_compose_source }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  register: gs_compose_source

- name: Refuse when infra/docker/gameservers.compose.yml is missing on the controller
  ansible.builtin.assert:
    that: gs_compose_source.stat.exists
    fail_msg: "{{ gameserver_compose_source }} not found"
    quiet: true

- name: Read the stack directory on the VM
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ gameserver_dir }}/.env"
    - "{{ gameserver_dir }}/gameservers.compose.yml"
  register: gs_remote_files

- name: Refuse when the VM has no stack to update
  ansible.builtin.assert:
    that: gs_remote_files.results | selectattr('stat.exists') | list | length == 2
    fail_msg: >-
      {{ gameserver_dir }}/.env or gameservers.compose.yml is missing. First-time setup is
      tools/deploy-gameservers-azure.ps1 (it writes the shared secret); this playbook only updates.
    quiet: true

- name: Read the current image and check the shared secret is set (values are not printed)
  ansible.builtin.shell: |
    set -euo pipefail
    grep -Eq '^IRONFRONT_SHARED_SECRET=.{32,}$' .env || { echo 'NO_SECRET'; exit 0; }
    sed -n 's/^IRONFRONT_GAMESERVER_IMAGE=//p' .env | tail -1
  args:
    chdir: "{{ gameserver_dir }}"
    executable: /bin/bash
  register: gs_env_read
  changed_when: false

- name: Refuse when .env has no usable shared secret
  ansible.builtin.assert:
    that: gs_env_read.stdout != 'NO_SECRET'
    fail_msg: "{{ gameserver_dir }}/.env has no IRONFRONT_SHARED_SECRET of 32+ characters; not touching it."
    quiet: true

- name: Remember the image running before this run
  ansible.builtin.set_fact:
    gs_previous_image: "{{ gs_env_read.stdout | trim }}"
    gs_compose_differs: "{{ gs_remote_files.results[1].stat.checksum != gs_compose_source.stat.checksum }}"

- name: Refuse when the previous image is unknown (nothing to roll back to)
  ansible.builtin.assert:
    that: gs_previous_image is match('^ironfront-game-server:[0-9a-f]{7,40}$')
    fail_msg: "IRONFRONT_GAMESERVER_IMAGE in .env is '{{ gs_previous_image }}'; a rollback needs a known image."
    quiet: true

- name: Check the new image is already on the VM
  ansible.builtin.command: sudo -n docker image inspect --format '{% raw %}{{.Id}}{% endraw %}' {{ gameserver_image }}
  register: gs_image_inspect
  changed_when: false
  failed_when: false

- name: Refuse an image the VM does not hold
  ansible.builtin.assert:
    that: gs_image_inspect.rc == 0
    fail_msg: >-
      {{ gameserver_image }} is not on the VM. Ship it with
      pwsh tools/deploy-gameservers-azure.ps1 -Image {{ gameserver_image }} (CI cannot build the server).
    quiet: true

- name: Read each container's latest room event
  ansible.builtin.shell: |
    set -euo pipefail
    if ! sudo -n docker inspect "{{ item }}" >/dev/null 2>&1; then echo absent; exit 0; fi
    line=$(sudo -n docker logs "{{ item }}" 2>&1 | grep -E 'master assigned room|last player left room' | tail -1 || true)
    echo "${line:-none}"
  args:
    executable: /bin/bash
  loop: "{{ gameserver_containers }}"
  register: gs_rooms
  changed_when: false

- name: Refuse while a room is live (a restart drops its players)
  ansible.builtin.assert:
    that: gs_live_rooms | length == 0 or gameserver_force | bool
    fail_msg: >-
      Live room on {{ gs_live_rooms | join(', ') }}. Wait for it to end, or rerun with force=true
      (its players are dropped).
    quiet: true
  vars:
    gs_live_rooms: "{{ gs_rooms.results | selectattr('stdout', 'search', 'master assigned room') | map(attribute='item') | list }}"

- name: Check the servers are healthy now (the state a rollback returns to)
  ansible.builtin.include_tasks: verify.yml
  vars:
    gs_expected_image: "{{ gs_previous_image }}"
    gs_verify_timeout: 0
  when: not gameserver_force | bool

- name: Decide whether anything changes
  ansible.builtin.set_fact:
    gs_noop: "{{ gs_previous_image == gameserver_image and not gs_compose_differs | bool }}"

- name: Report a no-op
  ansible.builtin.debug:
    msg: "{{ gameserver_image }} is already configured and the compose file is unchanged; only verifying."
  when: gs_noop | bool

# ---- 2. backup (before any change) -------------------------------------------------------------

- name: Name this run's backup directory
  ansible.builtin.set_fact:
    gs_backup_dir: "{{ gameserver_dir }}/backups/{{ now(utc=true, fmt='%Y%m%d-%H%M%S') }}"
  when: not gs_noop | bool

- name: Back up .env, the compose file and every container's log
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    mkdir -p "{{ gs_backup_dir }}"
    cp -p .env gameservers.compose.yml "{{ gs_backup_dir }}/"
    for c in {{ gameserver_containers | join(' ') }}; do
      if sudo -n docker inspect "$c" >/dev/null 2>&1; then
        sudo -n docker logs -t "$c" > "{{ gs_backup_dir }}/$c.log" 2>&1
      fi
    done
    # Keep the five newest backups.
    ls -1dt backups/*/ | tail -n +6 | xargs -r rm -rf --
  args:
    chdir: "{{ gameserver_dir }}"
    executable: /bin/bash
  when: not gs_noop | bool

# ---- 3-5. change, verify, roll back on failure ---------------------------------------------------

- name: Switch to the new image
  when: not gs_noop | bool
  block:
    - name: Install infra/docker/gameservers.compose.yml
      ansible.builtin.copy:
        src: "{{ gameserver_compose_source }}"
        dest: "{{ gameserver_dir }}/gameservers.compose.yml"
        mode: "0644"

    - name: Point .env at the new image
      ansible.builtin.lineinfile:
        path: "{{ gameserver_dir }}/.env"
        regexp: '^IRONFRONT_GAMESERVER_IMAGE='
        line: "IRONFRONT_GAMESERVER_IMAGE={{ gameserver_image }}"
        mode: "0600"

    - name: docker compose up -d
      ansible.builtin.command: sudo -n docker compose --env-file .env -f gameservers.compose.yml up -d
      args:
        chdir: "{{ gameserver_dir }}"

    - name: Verify the new image registered with the master
      ansible.builtin.include_tasks: verify.yml
      vars:
        gs_expected_image: "{{ gameserver_image }}"

  rescue:
    - name: Roll back .env and the compose file
      ansible.builtin.shell: |
        set -euo pipefail
        cp -p "{{ gs_backup_dir }}/.env" "{{ gs_backup_dir }}/gameservers.compose.yml" .
        sudo -n docker compose --env-file .env -f gameservers.compose.yml up -d
      args:
        chdir: "{{ gameserver_dir }}"
        executable: /bin/bash

    - name: Verify the previous image registered again
      ansible.builtin.include_tasks: verify.yml
      vars:
        gs_expected_image: "{{ gs_previous_image }}"

    - name: Fail the run after a successful rollback
      ansible.builtin.fail:
        msg: >-
          {{ gameserver_image }} did not come up registered; rolled back to {{ gs_previous_image }},
          which registered again. Logs from before the deploy: {{ gs_backup_dir }}.

- name: Verify the running servers (no-op run)
  ansible.builtin.include_tasks: verify.yml
  vars:
    gs_expected_image: "{{ gameserver_image }}"
  when: gs_noop | bool
