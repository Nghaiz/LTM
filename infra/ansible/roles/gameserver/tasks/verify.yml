---
# Every container runs gs_expected_image and has logged "master link: registered as server" since
# its CURRENT start. A server that binds its port but never registers refuses every join, so a
# port check would be a false green; a registration line from before a restart proves nothing.
- name: Wait for each container to register with the master
  ansible.builtin.shell: |
    set -euo pipefail
    c="{{ item }}"
    read -r image running started < <(sudo -n docker inspect -f '{% raw %}{{.Config.Image}} {{.State.Running}} {{.State.StartedAt}}{% endraw %}' "$c")
    [ "$image" = "{{ gs_expected_image }}" ] || { echo "$c runs $image"; exit 1; }
    [ "$running" = true ] || { echo "$c is not running"; exit 1; }
    line=$(sudo -n docker logs --since "$started" "$c" 2>&1 | grep 'master link: registered as server' | tail -1 || true)
    [ -n "$line" ] || { echo "$c has not registered since $started"; exit 1; }
    echo "$c: $line"
  args:
    executable: /bin/bash
  loop: "{{ gameserver_containers }}"
  register: gs_verify
  until: gs_verify.rc == 0
  retries: "{{ (gs_verify_timeout | default(gameserver_register_timeout) | int) // (gameserver_register_poll | int) }}"
  delay: "{{ gameserver_register_poll | int }}"
  changed_when: false

- name: Report registration
  ansible.builtin.debug:
    msg: "{{ gs_verify.results | map(attribute='stdout') | list }}"
