---
# Required: -e gameserver_image=ironfront-game-server:<git rev>. No default, so nothing deploys by accident.
gameserver_image: ""
# true = restart even while a room is live (its players are dropped).
gameserver_force: false

# Where tools/deploy-gameservers-azure.ps1 keeps the stack. The compose project name comes from this
# directory's name ("ironfront"), so it must never move: another directory is another project, and
# its `up` would collide with the running containers' names.
gameserver_dir: "/home/{{ ansible_user }}/ironfront"
gameserver_compose_source: "{{ role_path }}/../../../docker/gameservers.compose.yml"
gameserver_containers:
  - ironfront-gs-dustbowl
  - ironfront-gs-island
  - ironfront-gs-forestlake

gameserver_register_timeout: 180
gameserver_register_poll: 5
