---
# tasks file for common
- name: Verify Docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false

- name: Verify Docker Compose v2 is installed
  ansible.builtin.command: docker compose version
  register: docker_compose_check
  changed_when: false

- name: Ensure base Ironfront directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - "{{ ironfront_root_dir }}"
    - "{{ ironfront_tls_dir }}"
    - "{{ ironfront_bin_dir }}"

- name: Ensure data directory exists with correct non-root permissions
  ansible.builtin.file:
    path: "{{ ironfront_data_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ ironfront_uid }}"
    group: "{{ ironfront_gid }}"

- name: Log in to GitHub Container Registry (GHCR) if credentials provided
  ansible.builtin.shell: |
    echo "{{ ghcr_token }}" | docker login {{ ghcr_registry }} -u "{{ ghcr_user }}" --password-stdin
  no_log: true
  when:
    - ghcr_user | length > 0
    - ghcr_token | length > 0
  changed_when: false
