---
# Tasks for standalone single-VM deployment

- name: Refuse :latest tags for standalone images
  ansible.builtin.fail:
    msg: "Refusing :latest tag. Pin an immutable digest (@sha256:...) or specific tag."
  when: "':latest' in standalone_master_image or ':latest' in standalone_gameserver_image"

- name: Ensure standalone root and subdirectories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ standalone_root_dir }}"
    - "{{ ironfront_data_dir }}"
    - "{{ standalone_tls_dir }}"

- name: Render standalone compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ standalone_root_dir }}/compose.yaml"
    mode: "0644"

- name: Render standalone .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ standalone_root_dir }}/.env"
    mode: "0600"
  when: ironfront_shared_secret | length > 0
  no_log: true

- name: Pull standalone images
  ansible.builtin.command: >
    docker compose --project-directory {{ standalone_root_dir }} --env-file {{ standalone_root_dir }}/.env pull
  register: standalone_pull_result
  changed_when: "'Downloaded' in standalone_pull_result.stdout or 'Pull complete' in standalone_pull_result.stdout"

- name: Start standalone stack
  ansible.builtin.command: >
    docker compose --project-directory {{ standalone_root_dir }} --env-file {{ standalone_root_dir }}/.env up -d --remove-orphans

- name: Wait for standalone master to report healthy
  ansible.builtin.command: >
    docker inspect --format '{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}{% endraw %}'
    ironfront-master-1
  register: standalone_health_check
  until: standalone_health_check.stdout == 'healthy'
  retries: "{{ standalone_health_retries }}"
  delay: "{{ standalone_health_delay }}"
  changed_when: false
