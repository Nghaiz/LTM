# Run from infra/ansible/ (or set ANSIBLE_CONFIG to this file).
[defaults]
inventory = inventory/production.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
# Host keys are CHECKED: pinned-hostkeys.txt (known_hosts format, public keys only) pins the VM's
# key, and the CD workflow installs it as ~/.ssh/known_hosts. A changed key stops the run instead
# of trusting a stranger.
host_key_checking = True
timeout = 30

[ssh_connection]
pipelining = True
# No connection sharing (Ansible's default is ControlMaster=auto + ControlPersist=60s): a shared
# connection is reused WITHOUT checking the host key again, so a run started within a minute of
# another one would trust whatever host that socket leads to. Measured: with a wrong key pinned, a
# second run still deployed through the open socket. Each connection now verifies the key.
ssh_args = -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes
