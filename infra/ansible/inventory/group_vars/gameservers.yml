---
# Connection settings: can be overridden via extra-vars (gameserver_host, gameserver_user)
# or env vars/secrets (GAMESERVER_HOST, GAMESERVER_USER). Defaults to Azure VM.
ansible_host: "{{ gameserver_host | default(lookup('env', 'GAMESERVER_HOST') | default('20.205.152.66', true), true) }}"
ansible_user: "{{ gameserver_user | default(lookup('env', 'GAMESERVER_USER') | default('irondev', true), true) }}"

# Configuration for Ironfront Game Server host(s)
gameserver_root_dir: "/home/{{ ansible_user }}/ironfront"
gameserver_image_repo: "ironfront-game-server"
gameserver_image: "{{ lookup('env', 'IRONFRONT_GAMESERVER_IMAGE') | default('ironfront-game-server:latest', true) }}"

# Master server connection configuration
gameserver_master_host: "52-62-179-111.sslip.io"
gameserver_master_port: 443
gameserver_master_tls: "1"
gameserver_master_tls_target_host: "52-62-179-111.sslip.io"

# Host public IPv4 advertised to connecting players
gameserver_public_ip: "20.205.152.66"

# Game server parameters
gameserver_max_players: "16"
gameserver_max_connections: "16"
gameserver_log_level: "Info"
gameserver_log_frames: "1"

# Maps and ports (admitted by Azure NSG: UDP 27015-27017)
gameserver_instances:
  - name: dustbowl
    container_name: ironfront-gs-dustbowl
    scene: Dustbowl
    port: 27015
    map_ids: "1"
  - name: island
    container_name: ironfront-gs-island
    scene: Island
    port: 27016
    map_ids: "2"
  - name: forestlake
    container_name: ironfront-gs-forestlake
    scene: "Forest Lake"
    port: 27017
    map_ids: "3"

# Verification timeout for game server registration (in seconds)
gameserver_register_timeout: 180
