# Staging Inventory for Ironfront deployment

[master]
# Staging EC2 or VM Master Server
ironfront-master-staging ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ubuntu

[gameservers]
# Staging Game Servers
ironfront-gameserver-staging ansible_host=127.0.0.1 ansible_port=2223 ansible_user=irondev

[standalone]
# Staging Standalone VM
ironfront-standalone-staging ansible_host=127.0.0.1 ansible_port=2224 ansible_user=irondev

[all:vars]
ansible_python_interpreter = auto_silent
