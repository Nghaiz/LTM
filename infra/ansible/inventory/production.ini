# Production Inventory for Ironfront deployment

[master]
# AWS EC2 Master Server (host & user managed in group_vars/master.yml with default fallback)
ironfront-master

[gameservers]
# Azure VM Game Servers (Standard_B2as_v2, Southeast Asia)
ironfront-gameserver

[standalone]
# Standalone Single-VM deployment
ironfront-standalone

[all:vars]
ansible_python_interpreter = auto_silent
