# The game-server host: Azure VM "ironfront-game" (Standard_B2as_v2, Southeast Asia).
# The address is fixed here on purpose, next to its pinned host key in ../pinned-hostkeys.txt: a host that
# a secret or a variable could redirect would make the key pin meaningless.
#
# The EC2 master is NOT here. It has no SSH (no port 22, no key pair); it is deployed over SSM by
# infra/terraform/aws/master/deploy.sh, which the CD workflow calls for target=master.

[gameservers]
ironfront-game ansible_host=20.205.152.66 ansible_user=irondev
